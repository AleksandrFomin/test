<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Keyboard event demo</title>
    <style>
        body { font‑family: sans-serif; margin: 2rem; }
        #output { white‑space: pre-wrap; background:#f8f8f8; padding:1rem; border:1px solid #ccc; }
    </style>
</head>
<body>
    <script>
        let frame = document.createElement('iframe');
document.body.appendChild(frame);
setTimeout(() => {
    try {
        const win = frame.contentWindow.open('about:blank', '_blank', 'width=400,height=400');
        if (!win || win.closed || typeof win.closed === 'undefined') {
            console.warn("Popup blocked");
        }
    } catch (e) {
        console.log("exception caught");
    }
    frame.remove();
}, 500);
    </script>
</body>
</html>
